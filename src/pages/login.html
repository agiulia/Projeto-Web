
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-body-tertiary min-vh-100 d-flex align-items-center">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5">
                <div class="text-center mb-4"><a href="/" class="text-decoration-none"><span class="fs-1">📚</span>
                        <h1 class="h3 text-dark mt-2">Biblioteca Virtual</h1>
                    </a>
                    <p class="text-secondary">Entre para acessar sua conta</p>
                </div>
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        <h2 class="h4 mb-4">Entrar</h2>
                        <div id="feedback"></div>
                        <form id="formLogin" action="/login" method="post" novalidate>
                            <div class="mb-3"><label for="email" class="form-label">E-mail</label><input
                                    class="form-control form-control-lg" type="email" id="email" name="email"
                                    autocomplete="email" required>
                                <div class="invalid-feedback">Informe um e-mail válido.</div>
                            </div>
                            <div class="mb-3"><label for="senha" class="form-label">Senha</label><input
                                    class="form-control form-control-lg" type="password" id="senha" name="password"
                                    autocomplete="current-password" required minlength="6">
                                <div class="invalid-feedback">Informe sua senha (mínimo de 6 caracteres).</div>
                            </div><button class="btn btn-primary btn-lg w-100" type="submit">Entrar</button>
                        </form>
                        <p class="text-center text-secondary mt-4 mb-0">Ainda não tem conta? <a
                                href="/usuarios/cadastro">Cadastre-se</a></p>
                    </div>
                </div>
                <p class="text-center mt-3"><a class="link-secondary small" href="/">Voltar para a página inicial</a>
                </p>
            </div>
        </div>
    </main>

</body>
</html>
