<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light min-vh-100 d-flex flex-column">

    <header class="bg-primary text-white p-4">
        <h1>Bem-vindo à Biblioteca</h1>

        <nav>
            <ul class="nav">
                <li class="nav-item">
                    <a class="nav-link text-white" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="login.html">Login</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="cadastro.html">Cadastro</a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="container my-5 flex-grow-1">
        <form action="login.html" method="post" class="bg-white p-4 rounded shadow">

            <label for="username" class="form-label">Campo de busca</label>
            <input type="text" id="username" name="username"
                class="form-control mb-3" required>

            <label for="password" class="form-label">Pesquisar por</label>
            <select id="password" name="password"
                class="form-select mb-3" required>
                <option value="">Selecione uma opção</option>
                <option value="opcao1">Opção 1</option>
                <option value="opcao2">Opção 2</option>
            </select>

            <button type="submit" class="btn btn-primary">
                Pesquisar
            </button>

            <div class="mt-5">
                <h1 class="text-primary">Informações gerais</h1>
                <div class="bg-light p-3 rounded">
                    <p>exemplo de informações gerais</p>
                </div>
            </div>

        </form>
    </main>

    <footer class="bg-white text-center p-3 border-top mt-auto">
        <p>© 2026 Meu Site. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
